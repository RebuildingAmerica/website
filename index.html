  <body>
    <main class="page">
      <section class="quote-section px-12 py-16 max-sm:px-6 max-sm:py-10">
        <blockquote class="max-w-2xl">
          <p class="quote-text text-display-medium tracking-display text-on-surface font-bold">

          <a
            class="text-body-large text-primary block no-underline hover:underline"
            href="mailto:hello@rebuildingus.org"
            >hello@rebuildingus.org</a
          >

          <footer class="mt-8 flex gap-6">
            <a

              >About</a
            >
